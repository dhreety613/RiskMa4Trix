[project]
name = "ma3trix-backend"
version = "0.1.0"
description = "Ma3Trix backend: ingestion, risk extraction, drift, scoring, Monte Carlo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pgvector>=0.3",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "feedparser>=6.0",
  "yfinance>=0.2.40",
  "fastembed>=0.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates these - don't fight its formatting on every revision.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
