  source: assumption

- slug: cybersecurity
  p0: 0.12
  n0: 15
  source: "Directionally informed by industry breach-frequency surveys (e.g. IBM Cost of a Data Breach) reporting double-digit percent annual incidence for large organizations - not a literal match to this definition of 'material.'"
  rationale: Kept well below survey-reported ANY-incident rates since this category means a MATERIAL breach, which is rarer.

