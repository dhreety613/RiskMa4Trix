      control_type: prevent
      effectiveness_frequency: [0.20, 0.45]
    - name: Cyber insurance
      control_type: transfer
      effectiveness_severity: [0.20, 0.50]

- group: supply_chain
  actions:
    - name: Dual/multi-sourcing of critical components
      control_type: reduce
      effectiveness_frequency: [0.15, 0.35]
    - name: Safety stock / buffer inventory
      control_type: reduce
      effectiveness_severity: [0.10, 0.30]

- group: concentration
  actions:
