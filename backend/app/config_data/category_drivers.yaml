# Maps each risk category to an impact driver for scoring/impact.py.
#
# driver: "interest_rate" uses total debt directly (we actually ingest
#   this) with an assumed rate-move shock; everything else uses
#   "revenue_share" - exposure = revenue * revenue_share_assumption,
#   shock = the company's own historical 95th-percentile 1yr drawdown
#   (price_stats.dd95_1y) as a "how bad can things get for this company"
#   severity proxy.
#
# Honesty note: this is a deliberate simplification given what's
# actually ingested (CLAUDE.md: no foreign_revenue_share, no top-
# customer revenue share, no floating-vs-fixed debt split - Phase 2
# didn't pull those XBRL tags). A sharper model would drive FX impact
# off actual foreign revenue share and concentration impact off actual
# customer concentration; this uses the same revenue_share_assumption
# mechanism for all of them instead and documents it as a fallback
# every time (RiskScore.fallbacks). revenue_share_assumption values
# below are directional judgment, not measured - bigger for categories
# where a bad year plausibly touches a large slice of revenue (supply
# chain, concentration), smaller where it's more contained (one lawsuit,
# one pension plan).

