databases:
  - name: ma3trix-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: matrix
    user: matrix

services:
  - type: web
    name: ma3trix-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ma3trix-db
          property: connectionString
      - key: SEC_USER_AGENT
        sync: false # set per-deploy: "<app name> <contact email>"
      - key: LLM_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://ma3trix-frontend.onrender.com
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5

  - type: web
    name: ma3trix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ma3trix-api.onrender.com

# Note: this deployment was actually created via direct Render API calls
# (POST /v1/postgres, POST /v1/services x2) rather than a Blueprint sync,
# since Render's API has no "create Blueprint from repo" endpoint - only
# validate/update/list for Blueprints that already exist. This file
# documents the same topology as infra-as-code and would work if synced
# via the Dashboard's "New Blueprint Instance" flow (New -> Blueprint,
# pointing at this repo) instead.
#
# After first deploy, `alembic upgrade head` (run automatically by
# backend/Dockerfile's CMD) creates the pgvector extension and full
# schema - nothing manual needed on the database beyond what's already
# in migration 001.
